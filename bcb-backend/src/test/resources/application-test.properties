# Sử dụng H2 (DB in-memory) để test cho nhẹ và không ảnh hưởng DB thật
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Tách test khỏi file .env cục bộ để CI có thể khởi động context ổn định.
spring.redis.host=127.0.0.1
spring.redis.port=6379
JWT_EXPIRATION_MS=86400000
JWT_SECRET_KEY=12345678901234567890123456789012
MOMO_REDIRECT_URL=http://localhost:5173/payment-result
